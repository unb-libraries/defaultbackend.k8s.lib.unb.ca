name: Deploy defaultbackend.k8s.lib.unb.ca

on:
  push:
    branches: [ingress-nginx]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: unb-libraries/github-workflows/.github/workflows/build-push-deploy-notify.yaml@1.x
    with:
      branch-env-map: '{"ingress-nginx":"ingress-nginx"}'
      deploy-branches: '["ingress-nginx"]'
      image-name: 'ghcr.io/unb-libraries/defaultbackend.k8s.lib.unb.ca'
      k8s-deployment-name: 'defaultbackend-k8s-lib-unb-ca'
      platforms: 'linux/amd64'
      check-logs: true
      log-check-profile: 'generic'
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
